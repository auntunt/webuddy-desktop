<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Webuddy</title>
<style>
  /* Vercel 风格：纯黑底、1px 极细描边、单一强调色、无渐变、靠留白与字号分层 */
  :root{
    --bg:#000; --fg:#ededed; --dim:#8f8f8f; --faint:#666;
    --line:#262626; --line2:#333;
    --card:#0a0a0a; --hover:#161616;
    --accent:#0070f3; --ok:#45a557; --warn:#f5a623; --bad:#e5484d;
    --r:8px;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{background:var(--bg)}
  body{margin:0;color:var(--fg);
    font:13.5px/1.55 -apple-system,BlinkMacSystemFont,"Inter","PingFang SC",sans-serif;
    -webkit-font-smoothing:antialiased;font-feature-settings:"tnum"}
  a{color:var(--fg);text-decoration:none}
  /* ── 顶栏 ── */
  .top{position:sticky;top:0;z-index:40;background:rgba(0,0,0,.8);backdrop-filter:saturate(180%) blur(12px);
    border-bottom:1px solid var(--line)}
  .top-in{max-width:1320px;margin:0 auto;padding:0 20px;height:52px;display:flex;align-items:center;gap:18px}
  .logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px;letter-spacing:-.01em}
  .logo i{width:15px;height:15px;border-radius:3px;background:var(--fg);display:inline-block}
  .tabs{display:flex;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);padding:2px}
  .tab{padding:5px 12px;border-radius:6px;color:var(--dim);cursor:pointer;font-size:12.5px;
    font-weight:500;transition:background .12s,color .12s;white-space:nowrap}
  .tab:hover{color:var(--fg)}
  .tab.on{background:#1f1f1f;color:var(--fg)}
  .sp{flex:1}
  .who{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--dim)}
  .avatar{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;
    font-size:10.5px;font-weight:600;background:#1f1f1f;border:1px solid var(--line2);color:var(--fg)}
  /* ── 布局 ── */
  main{max-width:1320px;margin:0 auto;padding:20px 20px 96px}
  .view{display:none}.view.on{display:block}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
  .sec+.sec{margin-top:16px}
  h2{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    color:var(--faint);margin:0 0 12px}
  .grid{display:grid;gap:12px}
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g5{grid-template-columns:repeat(5,1fr)}
  @media(max-width:1024px){.g5{grid-template-columns:repeat(3,1fr)}.g2,.g3{grid-template-columns:1fr}}
  @media(max-width:640px){.g5{grid-template-columns:1fr 1fr}}
  /* ── 控件 ── */
  input,select,button,textarea{font:inherit;font-size:12.5px;color:var(--fg);background:#000;
    border:1px solid var(--line2);border-radius:6px;padding:6px 10px;transition:border-color .12s}
  input:hover,select:hover{border-color:#4a4a4a}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--fg)}
  input::placeholder{color:var(--faint)}
  button{cursor:pointer;background:#111}
  button:hover{background:#1c1c1c;border-color:#4a4a4a}
  button.primary{background:var(--fg);border-color:var(--fg);color:#000;font-weight:500}
  button.primary:hover{background:#ccc;border-color:#ccc}
  button.ghost{background:transparent;border-color:transparent;color:var(--dim);padding:5px 8px}
  button.ghost:hover{background:#1a1a1a;color:var(--fg);border-color:transparent}
  button.danger{color:var(--bad)}
  button.danger:hover{background:#1a0d0d;border-color:#5c2626}
  button:disabled{opacity:.4;cursor:not-allowed}
  select{cursor:pointer}
  /* ── 指标 ── */
  .kpi .k{font-size:11.5px;color:var(--dim);display:flex;align-items:center;gap:5px}
  .kpi .v{font-size:24px;font-weight:600;letter-spacing:-.025em;margin-top:4px;font-variant-numeric:tabular-nums}
  .kpi .s{font-size:11.5px;color:var(--faint);margin-top:2px}
  /* ── 排行条 ── */
  .bar{display:grid;grid-template-columns:180px 1fr 64px;align-items:center;gap:10px;
    padding:4px 0;font-size:12.5px}
  .bar .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dim)}
  .track{height:6px;background:#1a1a1a;border-radius:99px;overflow:hidden}
  .fill{height:100%;background:var(--fg);border-radius:99px;opacity:.85}
  .bar .num{text-align:right;color:var(--fg);font-variant-numeric:tabular-nums;font-size:12px}
  /* 展开后限高滚动，避免一屏铺满几十条 */
  .bars-scroll{max-height:340px;overflow:auto;padding-right:4px}
  .bars-scroll::-webkit-scrollbar{width:8px}
  .bars-scroll::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:4px}
  /* ── 表格 ── */
  .tw{border:1px solid var(--line);border-radius:var(--r);overflow:auto}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--faint);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.05em;
    background:#0d0d0d;position:sticky;top:52px}
  tbody tr:last-child td{border-bottom:0}
  tbody tr.clickable{cursor:pointer}
  tbody tr.clickable:hover{background:var(--hover)}
  .dim{color:var(--dim)}
  .mono{font-family:var(--mono);font-size:11.5px}
  .pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:1px 7px;
    border-radius:99px;border:1px solid var(--line2);color:var(--dim);white-space:nowrap}
  .pill.ok{color:var(--ok);border-color:#1c4028}
  .pill.warn{color:var(--warn);border-color:#4a3a12}
  .pill.bad{color:var(--bad);border-color:#4a1f20}
  .pill.brand{color:var(--fg);border-color:var(--line2);background:#141414}
  .empty{color:var(--faint);text-align:center;padding:48px 0;font-size:12.5px;line-height:1.9}
  /* ── 抽屉 ── */
  .scrim-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:45;opacity:0;pointer-events:none;
    transition:opacity .18s}
  .scrim-bg.on{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(860px,94vw);background:#0a0a0a;
    border-left:1px solid var(--line);transform:translateX(100%);transition:transform .2s cubic-bezier(.32,.72,0,1);
    z-index:50;display:flex;flex-direction:column}
  .drawer.on{transform:none}
  .dh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex:none}
  .dh strong{font-size:13px;font-weight:500}
  .db{overflow:auto;padding:18px;flex:1}
  pre{background:#000;border:1px solid var(--line);border-radius:var(--r);padding:14px;
    white-space:pre-wrap;word-break:break-word;font-size:11.5px;font-family:var(--mono);
    line-height:1.65;color:#c9c9c9}
  /* ── 模态 ── */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:60;display:grid;place-items:center;padding:20px}
  .modal{background:#0a0a0a;border:1px solid var(--line2);border-radius:10px;width:100%;max-width:420px;
    padding:22px;box-shadow:0 24px 64px rgba(0,0,0,.8)}
  .modal h3{margin:0 0 5px;font-size:15px;font-weight:600;letter-spacing:-.01em}
  .modal p.sub{margin:0 0 16px;color:var(--dim);font-size:12.5px;line-height:1.6}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:11.5px;color:var(--dim);margin-bottom:5px}
  .field input,.field select{width:100%}
  .hide{display:none !important}
  .msg{font-size:12px;margin-top:10px;min-height:16px}
  .msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid #141414;font-size:12.5px}
  .kv:last-child{border-bottom:0}
  .kv .k{color:var(--dim)}
</style>
</head>
<body>
<div class="top"><div class="top-in">
  <span class="logo"><i></i>Webuddy</span>
  <nav class="tabs">
    <div class="tab on" data-view="data">总览</div>
    <div class="tab" data-view="analysis">AI 分析</div>
    <div class="tab" data-view="skills">Skill 库</div>
    <div class="tab hide" id="tab-users" data-view="users">用户</div>
  </nav>
  <span class="sp"></span>
  <span class="who" id="who"></span>
  <button class="ghost" id="logout">退出</button>
</div></div>

<main>
  <!-- ===== 总览 ===== -->
  <section class="view on" id="view-data">
    <div class="card sec">
      <div class="row">
        <select id="f-user"><option value="">全部人员</option></select>
        <select id="f-agent"><option value="">全部 agent</option></select>
        <select id="f-project"><option value="">全部项目</option></select>
        <span class="sp"></span>
        <span class="dim" style="font-size:12px">区间</span>
        <div class="tabs" id="f-range">
          <div class="tab" data-days="7">7天</div>
          <div class="tab" data-days="30">30天</div>
          <div class="tab" data-days="90">90天</div>
          <div class="tab on" data-days="0">全部</div>
        </div>
        <input id="f-from" type="date" title="起始日期"><span class="dim">–</span>
        <input id="f-to" type="date" title="结束日期">
      </div>
      <div class="row" style="margin-top:10px">
        <input id="f-q" placeholder="搜索路径 / 分支 / 正文" style="flex:1;min-width:200px">
        <button class="primary" id="apply">应用</button>
        <button id="clear">清空</button>
        <span class="sp"></span>
        <button id="csv">CSV</button><button id="json">JSON</button>
      </div>
    </div>
    <div class="grid g5 sec" id="kpis"></div>
    <div class="grid g2 sec">
      <div class="card"><h2>按天</h2><div id="c-day"></div></div>
      <div class="card"><h2>按 agent</h2><div id="c-agent"></div></div>
    </div>
    <div class="grid g2 sec">
      <div class="card"><h2>按人</h2><div id="c-person"></div></div>
      <div class="card"><h2>按项目</h2><div id="c-project"></div></div>
    </div>
    <div class="card sec">
      <h2>会话明细 · 点击查看正文</h2>
      <div id="rows"></div>
      <div class="row" id="pager" style="margin-top:12px;justify-content:space-between"></div>
    </div>
  </section>

  <!-- ===== AI 分析 ===== -->
  <section class="view" id="view-analysis">
    <div class="card sec">
      <div class="row">
        <select id="a-user"></select>
        <button class="primary" id="a-run">立即分析</button>
        <button id="a-refresh">刷新</button>
        <span class="sp"></span>
        <span class="dim mono" id="a-meta"></span>
      </div>
      <div class="msg" id="a-msg"></div>
    </div>
    <div class="card sec"><h2>分析结果</h2><div id="a-body"></div></div>
  </section>

  <!-- ===== Skill 库 ===== -->
  <section class="view" id="view-skills">
    <div class="card sec">
      <div class="row">
        <select id="s-user"></select>
        <button class="primary" id="s-extract">立即提炼</button>
        <button id="s-refresh">刷新</button>
        <span class="sp"></span>
        <a id="s-bundle" class="pill brand" href="#" download>下载整包</a>
      </div>
      <div class="msg" id="s-msg"></div>
    </div>
    <div class="card sec"><h2>提炼出的 skill</h2><div id="s-list"></div></div>
  </section>

  <!-- ===== 用户 ===== -->
  <section class="view" id="view-users">
    <div class="card sec">
      <div class="row">
        <button class="primary" id="new-user">新建用户</button>
        <span class="sp"></span>
        <input id="u-q" placeholder="按用户名 / 姓名筛选" style="width:200px">
        <button id="u-refresh">刷新</button>
      </div>
    </div>
    <div class="card sec"><h2>账号</h2><div id="users"></div></div>
  </section>
</main>

<div class="scrim-bg" id="drawer-scrim"></div>
<aside class="drawer" id="drawer">
  <div class="dh"><strong id="d-title">会话详情</strong><span class="sp"></span>
    <button class="ghost" id="d-close">关闭</button></div>
  <div class="db" id="d-body"></div>
</aside>

<div class="scrim hide" id="scrim"><div class="modal" id="modal"></div></div>

<div class="scrim" id="login">
  <form class="modal" id="login-form">
    <h3>登录 Webuddy</h3>
    <p class="sub">用你的公司账号登录。成员只能看到自己的数据，管理员可看全量。</p>
    <div class="field"><label>用户名</label><input id="l-user" autocomplete="username" autofocus></div>
    <div class="field"><label>密码</label><input id="l-pass" type="password" autocomplete="current-password"></div>
    <button class="primary" style="width:100%">继续</button>
    <div class="msg bad" id="l-err"></div>
  </form>
</div>

<script src="/app.js"></script>
<script src="/admin.js"></script>
<script src="/analysis.js"></script>
<script src="/skills.js"></script>
</body>
</html>
